    async function hashPassword(str) {
      if (!str) return '';
      const enc = new TextEncoder();
      const hashBuffer = await crypto.subtle.digest('SHA-256', enc.encode(str));
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function calculateSmartSize(child) {
      if (!child) return { clothing: 'Standard', shoes: 'Standard', isSizedUp: false };
      const ov = child.sizeOverride || {};
      const age = Number(child.age) || 5;
      const height = child.isMeasurementsSkipped ? null : (Number(child.heightInches) || null);
      const weight = child.isMeasurementsSkipped ? null : (Number(child.weightLbs) || null);

      const finish = (clothing, shoes, isSizedUp) => ({
        clothing: ov.clothing || clothing,
        shoes: ov.shoes || shoes,
        isSizedUp: ov.clothing || ov.shoes ? false : isSizedUp,
        isManual: !!(ov.clothing || ov.shoes)
      });

      if (!height || !weight) {
        if (age <= 2) return finish('2T', '7C', false);
        if (age <= 3) return finish('3T', '8C', false);
        if (age <= 4) return finish('4T', '10C', false);
        if (age <= 5) return finish('5T / 5', '11C', false);
        if (age <= 6) return finish('6 / 6X', '12C', false);
        if (age <= 8) return finish('7/8 (S)', '1Y - 2Y', false);
        if (age <= 10) return finish('10/12 (M)', '3Y - 4Y', false);
        return finish('14/16 (L)', '5Y - 6Y', false);
      }

      let clothing = '6';
      let shoes = '12K';
      let isSizedUp = false;

      if (height < 35) { clothing = '2T'; shoes = '7C'; }
      else if (height < 38) { clothing = '3T'; shoes = '8C'; }
      else if (height < 41) { clothing = '4T'; shoes = '10C'; }
      else if (height < 44) { clothing = '5'; shoes = '11C'; }
      else if (height < 47) { clothing = '6'; shoes = '12C'; }
      else if (height < 51) { clothing = '7/8 (S)'; shoes = '1Y'; }
      else if (height < 56) { clothing = '10/12 (M)'; shoes = '3Y'; }
      else { clothing = '14/16 (L)'; shoes = '5Y'; }

      const baselineMaxWeight = (height * 1.05) - 3;
      if (weight > baselineMaxWeight) {
        isSizedUp = true;
        const sizeMap = {
          '2T': '3T', '3T': '4T', '4T': '5', '5': '6',
          '6': '7/8 (S)', '7/8 (S)': '10/12 (M)', '10/12 (M)': '14/16 (L)', '14/16 (L)': 'Adult Small'
        };
        clothing = sizeMap[clothing] || clothing;
      }

      return finish(clothing, shoes, isSizedUp);
    }

    function generateFamilyCode() {
      const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      const num = Math.floor(1000 + Math.random() * 9000);
      let prefix = '';
      for (let i = 0; i < 4; i++) prefix += letters.charAt(Math.floor(Math.random() * letters.length));
      return `${prefix}-${num}`;
    }

    function generateKidCode(name) {
      const clean = (name || 'KID').replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 4) || 'KID';
      const num = Math.floor(10 + Math.random() * 90);
      return `${clean}-${num}`;
    }

    function todayISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function isoToLabel(iso) {
      if (!iso) return '';
      const parts = String(iso).split('-');
      if (parts.length !== 3) return iso;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function fileToCompressedDataURL(file, cb) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 420;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const r = Math.min(max / w, max / h);
            w = Math.round(w * r);
            h = Math.round(h * r);
          }
          const cv = document.createElement('canvas');
          cv.width = w;
          cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          cb(cv.toDataURL('image/jpeg', 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

        const R = 3958.8;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

              // fallback: pre-fix docs used the dashed form (XXXX-0000)
              const dashed = code.slice(0, 4) + '-' + code.slice(4);
              snap = await window._bbdb.collection('families').doc(dashed).collection('parts').doc('meta').get();
            }
            if (snap.exists) {
              // Pre-load the code into familyData so the live subscription starts pulling data
              setFamilyData(prev => ({ ...(prev || {}), familyCode: code }));
              setJoinedFamilyCode(code);
              setJoinCodeError(null);
              setJoinStep('details');
              return;
            }
          } catch (err) {}
          setJoinCodeError(rawInput);
          return;
        }
        // Offline fallback: local check
        const activeCode = familyData?.familyCode?.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!activeCode || activeCode !== code) {
          const savedUsersRaw = localStorage.getItem(STORAGE_USERS);
          const registeredUsers = savedUsersRaw ? JSON.parse(savedUsersRaw) : [];
          const userWithCode = registeredUsers.find(u => (u.familyCode || '').toUpperCase().replace(/[^A-Z0-9]/g, '') === code);
          if (!userWithCode) {
            setJoinCodeError(rawInput);
            return;
          }

        setFamilyData(prev => ({ ...(prev || {}), familyCode: code }));
        setJoinedFamilyCode(code);
        setJoinCodeError(null);
        setJoinStep('details');

          const savedUsersRaw = localStorage.getItem(STORAGE_USERS);
          const registeredUsers = savedUsersRaw ? JSON.parse(savedUsersRaw) : [];

          name: memberName,
          role: memberRelation,
          description: memberDesc,
          email: memberEmail,
          accessRole: (memberRole === 'Observer' || memberRole === 'Grandparent') ? 'Viewer' : 'Updater',

        setChildren(children.map(c => {

        downloadAnchor.setAttribute('href', dataStr);

      const startVoiceRecording = async (targetContact = null) => {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            simulateVoiceFallback(targetContact);
            return;
          }
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mediaRecorder = new MediaRecorder(stream);
          mediaRecorderRef.current = mediaRecorder;
          audioChunksRef.current = [];
          setTargetContactVoice(targetContact);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => saveVoiceMsg(reader.result, targetContact);
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(tr => tr.stop());
          };

          mediaRecorder.start();
          setIsRecordingVoice(true);
          showToast(`Recording note for ${targetContact ? targetContact.name : 'Everyone'}... 🎙️`);
        } catch (err) {
          simulateVoiceFallback(targetContact);
        }
      };

      const checkTttWinner = (sq) => {
        const lines = [
          [0, 1, 2], [3, 4, 5], [6, 7, 8],
          [0, 3, 6], [1, 4, 7], [2, 5, 8],
          [0, 4, 8], [2, 4, 6]
        ];
        for (let [a, b, c] of lines) {
          if (sq[a] && sq[a] === sq[b] && sq[a] === sq[c]) return sq[a];
        }
        if (sq.every(v => v !== null)) return 'draw';
        return null;
      };

        const next = [...tttBoard];

        setTttBoard(next);

        const res = checkTttWinner(next);
        if (res) {
          setTttWinner(res);
          triggerConfetti();
          if (res === 'X') showToast(`🎉 ${activeChild.name} won! ✋`);

                      <select name="clSize" defaultValue={activeSize?.clothing || '4T'} className="w-full p-2.5 border-2 border-pink-200 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C]">
                        {CLOTHING_SIZES.map(s => (
                          <option key={s} value={s}>{s}</option>
                        ))}
                      </select>
                    )}
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-0.5">Photo (optional) — saved on this device only:</label>
                    <label className="px-3 py-2.5 rounded-xl border border-dashed border-pink-300 dark:border-slate-700 bg-pink-50/50 dark:bg-[#181E2C] text-xs font-bold text-slate-500 flex items-center justify-center gap-1.5 cursor-pointer">
                      <span>{closetPhotoData ? '✅ Photo added' : '📷 Add a photo'}</span>
                      <input
                        type="file"
                        accept="image/*"
                        className="hidden"
                        onChange={(e) => {
                          const f2 = e.target.files[0];
                          if (f2) fileToCompressedDataURL(f2, (url) => setClosetPhotoData(url));
                        }}
                      />
                    </label>
                    {closetPhotoData && <img src={closetPhotoData} alt="Closet item" className="w-full h-28 object-cover rounded-xl border-2 border-pink-200 mt-2" />}
                  </div>
                  <p className="text-[11px] text-slate-400">
                    It will be tagged automatically with {activeChild.name}'s smart size: <strong className="text-amber-700">{activeSize?.clothing}</strong>
                  </p>
                  <div className="flex gap-2 pt-1">
                    <button type="submit" className="flex-1 py-2.5 bg-bloom-pink text-white font-fredoka font-bold rounded-xl bubble-btn">Save to Closet</button>
                    <button type="button" onClick={() => { setShowAddClosetModal(false); setClosetPhotoData(null); }} className="px-4 py-2.5 bg-slate-100 dark:bg-[#181E2C] rounded-xl">Cancel</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* OUTFIT REQUEST MODAL */}
          {showOutfitRequestModal && activeChild && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
              <div className="bg-white dark:bg-[#131826] rounded-3xl p-6 max-w-sm w-full shadow-2xl border-3 border-pink-300 dark:border-slate-700 space-y-3 text-xs font-semibold animate-pop">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bubble text-xl text-bloom-pink">Request an Outfit</h3>
                  <button onClick={() => setShowOutfitRequestModal(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const f = e.target;
                  const req = {
                    id: 'or_' + Date.now(),
                    eventTitle: f.orEvent.value,
                    note: f.orNote.value.trim(),
                    packed: false
                  };
                  setChildren(children.map(c => c.id === activeChild.id ? { ...c, outfitRequests: [...(c.outfitRequests || []), req] } : c));
                  setShowOutfitRequestModal(false);
                  triggerConfetti();
                  showToast('Outfit requested! 🎒');
                }} className="space-y-3">
                  <div>
                    <label className="block text-slate-500 mb-0.5">For which event?</label>
                    <select name="orEvent" className="w-full p-2.5 border-2 border-pink-200 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C]">
                      {(activeChild.calendarEvents || []).length === 0 ? (
                        <option value="General">General (no event yet)</option>
                      ) : (
                        (activeChild.calendarEvents || []).map(ev => (
                          <option key={ev.id} value={ev.title}>{ev.title}</option>
                        ))
                      )}
                    </select>
                  </div>
                  <input name="orNote" placeholder="What to pack (e.g. The red dress + white shoes)" className="w-full p-2.5 border-2 border-pink-200 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C]" />
                  <div className="flex gap-2 pt-1">
                    <button type="submit" className="flex-1 py-2.5 bg-bloom-pink text-white font-fredoka font-bold rounded-xl bubble-btn">Send Request</button>
                    <button type="button" onClick={() => setShowOutfitRequestModal(false)} className="px-4 py-2.5 bg-slate-100 dark:bg-[#181E2C] rounded-xl">Cancel</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ZERO-COST STORAGE MODAL */}
          {showCloudSyncModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
              <div className="bg-white dark:bg-[#131826] rounded-3xl p-6 max-w-md w-full shadow-2xl border-3 border-emerald-300 dark:border-slate-700 space-y-4">
                <div className="flex items-center justify-between pb-2 border-b">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">💾</span>
                    <h3 className="font-bubble text-xl text-emerald-800 dark:text-emerald-300 font-bold">Share Your Family Invite</h3>
                  </div>
                  <button onClick={() => setShowCloudSyncModal(false)} className="text-slate-400 font-bold">✕</button>
                </div>

                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  This file <strong>is your invite</strong>. Send it straight to your family — they open it in the app, pick their role, and they're in. It also keeps everything on <strong>this device</strong> (nothing is uploaded to a server), so you can move to a new phone or bring everything back later.
                </p>

                <button
                  onClick={shareInviteFile}
                  className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-fredoka font-bold rounded-2xl shadow-md text-sm"
                >
                  📤 Send Invite
                </button>
                <p className="text-[10px] text-slate-400 font-bold text-center -mt-2">
                  Sends the invite file straight to WhatsApp or Messages — no downloading needed.
                </p>

                <div className="p-3 bg-amber-50 dark:bg-[#181E2C] rounded-2xl border border-amber-200 dark:border-slate-700 space-y-1.5">
                  <span className="font-bubble text-xs text-amber-900 dark:text-amber-200 font-bold block">
                    📦 What's inside this invite file:
                  </span>
                  <ul className="text-[11px] text-slate-600 dark:text-slate-300 font-semibold space-y-1">
                    <li>✓ {children.length} child profile(s) — names, ages, photos, sizes, allergies & safety notes</li>
                    <li>✓ {timelineLogs.length} daily care update(s) — meals, medicine, naps, handoffs</li>
                    <li>✓ {children.reduce((n, c) => n + (c.calendarEvents || []).length, 0)} calendar event(s)</li>
                    <li>✓ {familyChat.length} note(s) & voice message(s)</li>
                    <li>✓ {children.reduce((n, c) => n + (c.closet || []).length + (c.packingBag || []).length, 0)} closet & packing item(s)</li>
                    <li>✓ Your Access Code, so other devices can reconnect</li>
                  </ul>
                  <p className="text-[10px] text-slate-400 font-bold pt-1">
                    File name: bloombridge_vault_{familyData?.familyCode || 'data'}.json • Size: about {(JSON.stringify({ familyData, children, familyChat, timelineLogs }).length / 1024).toFixed(1)} KB
                  </p>
                </div>

                <div className="p-3 bg-emerald-50 dark:bg-[#181E2C] rounded-2xl border border-emerald-200 space-y-2">
                  <span className="font-bubble text-xs text-emerald-900 dark:text-emerald-200 font-bold block">
                    Access Code for Linking Devices:
                  </span>
                  <div className="flex items-center justify-between bg-white dark:bg-[#11151F] p-2 rounded-xl border font-mono font-bold text-sm text-bloom-coral">
                    <span>{activeAccessCode}</span>
                    <button
                      onClick={() => copyCodeOnly(activeAccessCode)}
                      className="px-2 py-1 bg-emerald-100 text-emerald-800 text-xs rounded-lg font-sans font-bold"
                    >
                      Copy
                    </button>
                  </div>
                </div>

                <div className="space-y-2 pt-1 text-xs">
                  <span className="font-bubble text-xs text-emerald-900 dark:text-emerald-200 font-bold block">⬇️ Save a copy:</span>
                  <button
                    onClick={exportFamilyVaultJSON}
                    className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl flex items-center justify-center gap-2 shadow-xs"
                  >
                    <i className="fa-solid fa-download"></i>
                    <span>Download My Invite File (.json)</span>
                  </button>

                  <span className="font-bubble text-xs text-emerald-900 dark:text-emerald-200 font-bold block pt-1">⬆️ Bring a save back:</span>
                  <label className="w-full py-2.5 bg-slate-100 dark:bg-[#181E2C] hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-bold rounded-xl flex items-center justify-center gap-2 cursor-pointer border">
                    <i className="fa-solid fa-upload"></i>
                    <span>Restore from a File</span>
                    <input type="file" accept=".json" onChange={importFamilyVaultJSON} className="hidden" />
                  </label>
                  <p className="text-[11px] text-rose-600 dark:text-rose-300 font-semibold leading-relaxed">
                    ⚠️ Restoring replaces everything currently in the app with what's inside the file you pick. Download a fresh copy first if you want to keep what's here now.
                  </p>
                </div>

                <button onClick={() => setShowCloudSyncModal(false)} className="w-full py-1 text-slate-500 font-bold text-xs">
                  Close
                </button>
              </div>
            </div>
          )}

          {/* LIGHTING MODAL */}
          {showThemeModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
              <div className="bg-white dark:bg-[#131826] rounded-3xl p-6 max-sm:p-4 max-w-sm w-full shadow-2xl border-3 border-amber-300 dark:border-slate-700 space-y-4 text-center">
                <h3 className="font-bubble text-2xl">App Lighting & Mood</h3>
                <div className="space-y-2 text-xs font-bold text-left">
                  {[
                    { id: 'light', icon: '☀️', label: 'Light Mood (Sunny)' },
                    { id: 'dark', icon: '🌙', label: 'Dark Mood (Deep Night)' },
                    { id: 'system', icon: '📱', label: 'Follow Phone Settings' },
                    { id: 'time', icon: '⏰', label: 'Sunset Mode (7am-7pm Light)' }
                  ].map(m => (
                    <button
                      key={m.id}
                      onClick={() => { setThemeMode(m.id); setShowThemeModal(false); showToast(`Lighting: ${m.label}!`); }}
                      className={`w-full p-3 rounded-2xl border flex items-center justify-between ${themeMode === m.id ? 'bg-amber-100 border-amber-400 font-bold' : 'bg-slate-50 border-slate-200'}`}
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-xl">{m.icon}</span>
                        <span className="font-bubble text-sm">{m.label}</span>
                      </div>
                      {themeMode === m.id && <span>✓</span>}
                    </button>
                  ))}
                </div>
                <button onClick={() => setShowThemeModal(false)} className="w-full py-2 bg-slate-100 text-slate-600 rounded-xl font-bold text-xs">Close</button>
              </div>
            </div>
          )}

          {/* PRO MODAL */}
          {showProModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
              <div className="bg-white dark:bg-[#131826] rounded-3xl p-6 max-w-sm w-full shadow-2xl border-3 border-amber-300 dark:border-slate-700 space-y-4 text-center">
                <span className="text-4xl">👑</span>
                <h3 className="font-bubble text-2xl">4+ Kids Pro Plan</h3>
                <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  BloomBridge is <strong>100% free for up to 3 children</strong>. Managing 4 or more kids is $3.99/mo.
                </p>
                <button
                  onClick={() => { showToast('Pro trial activated!'); setShowProModal(false); setShowAddChildModal(true); }}
                  className="w-full py-3 bg-bloom-coral text-white font-fredoka font-bold rounded-2xl text-xs bubble-btn"
                >
                  Start 14-Day Free Pro Trial ($3.99/mo)
                </button>
                <button onClick={() => setShowProModal(false)} className="w-full py-2 bg-slate-100 text-slate-600 rounded-xl font-bold text-xs">
                  Continue Free (1–3 Kids)
                </button>
              </div>
            </div>
          )}

          {/* EDIT CHILD MODAL */}
          {showEditChildModal && activeChild && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
              <div className="bg-white dark:bg-[#131826] rounded-3xl p-6 max-w-md w-full shadow-2xl border-3 border-amber-200 dark:border-slate-700 space-y-4 max-h-[90vh] overflow-y-auto custom-scroll text-xs font-semibold">
                <div className="flex items-center justify-between pb-2 border-b">
                  <h3 className="font-bubble text-xl">Edit {activeChild.name}'s Profile</h3>
                  <button onClick={() => setShowEditChildModal(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const f = e.target;
                  const h = f.height.value ? Number(f.height.value) : null;
                  const w = f.weight.value ? Number(f.weight.value) : null;
                  const skip = f.skipMeasurements.checked;
                  const bnd = f.boundaries.value.trim();
                  const alg = f.allergies.value.trim();
                  const newName = f.childName.value.trim() || activeChild.name;
                  const renamed = newName !== activeChild.name;

                  setChildren(children.map(c => c.id === activeChild.id ? {
                    ...c,
                    name: newName,
                    age: Number(f.childAge.value) || c.age,
                    tag: f.childTag.value,
                    avatar: editAvatar,
                    statedDream: f.childDream.value.trim(),
                    bedtime: f.childBedtime.value.trim(),
                    interests: f.childInterests.value.split(',').map(s => s.trim()).filter(Boolean),
                    heightInches: h,
                    weightLbs: w,
                    isMeasurementsSkipped: skip,
                    boundaries: bnd,
                    allergies: alg
                  } : c));
                  if (renamed) {
                    setTimelineLogs(timelineLogs.map(l => l.childName === activeChild.name ? { ...l, childName: newName } : l));
                  }
                  setShowEditChildModal(false);
                  triggerConfetti();
                  showToast('Profile updated!');
                }} className="space-y-3">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-500 mb-0.5">Name:</label>
                      <input name="childName" defaultValue={activeChild.name} className="w-full p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100" />
                    </div>
                    <div>
                      <label className="block text-slate-500 mb-0.5">Age:</label>
                      <input name="childAge" type="number" min="1" max="18" defaultValue={activeChild.age} className="w-full p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-0.5">Nickname / Tag:</label>
                    <select name="childTag" defaultValue={activeChild.tag} className="w-full p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100">
                      {CHILD_TAG_OPTIONS.map(t => (
                        <option key={t} value={t}>{t}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-0.5">Avatar:</label>
                    <div className="grid grid-cols-7 gap-1 p-1 bg-amber-50 rounded-xl border border-amber-200">
                      {CHILD_AVATAR_OPTIONS.map((opt, aIdx) => (
                        <button
                          key={aIdx}
                          type="button"
                          onClick={() => setEditAvatar(opt.emoji)}
                          className={`h-8 rounded-lg flex items-center justify-center text-lg ${editAvatar === opt.emoji ? 'bg-amber-200 ring-2 ring-bloom-coral' : ''}`}
                          title={opt.label}
                        >
                          {opt.emoji}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-500 mb-0.5">Dream / Aspiration:</label>
                      <input name="childDream" defaultValue={activeChild.statedDream} className="w-full p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100" />
                    </div>
                    <div>
                      <label className="block text-slate-500 mb-0.5">Bedtime:</label>
                      <input name="childBedtime" defaultValue={activeChild.bedtime} placeholder="8:00 PM" className="w-full p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-0.5">Interests (powers activity suggestions 💡):</label>
                    <input name="childInterests" defaultValue={(activeChild.interests || []).join(', ')} placeholder="dinosaurs, swimming, art, music" className="w-full p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100" />
                  </div>
                  <label className="flex items-center gap-2 cursor-pointer p-2.5 bg-amber-50 dark:bg-[#181E2C] rounded-xl border border-amber-200 dark:border-slate-700">
                    <input name="skipMeasurements" type="checkbox" defaultChecked={activeChild.isMeasurementsSkipped} className="rounded" />
                    <span className="text-slate-700 dark:text-slate-200">Skip height & weight (estimate sizes by age)</span>
                  </label>
                  <label className="flex items-center gap-2 cursor-pointer p-2.5 bg-pink-50 dark:bg-[#181E2C] rounded-xl border border-pink-200 dark:border-slate-700">
                    <span className="text-slate-700 dark:text-slate-200">📷 {activeChild.photo ? 'Change profile photo' : 'Add a profile photo (optional)'}</span>
                    <input
                      type="file"
                      accept="image/*"
                      className="hidden"
                      onChange={(e) => {
                        const f = e.target.files[0];
                        if (f) fileToCompressedDataURL(f, (url) => {
                          setChildren(children.map(c => c.id === activeChild.id ? { ...c, photo: url } : c));
                          showToast('Photo saved! 📷');
                        });
                      }}
                    />
                  </label>
                  {activeChild.photo && (
                    <img src={activeChild.photo} alt={activeChild.name} className="w-14 h-14 rounded-2xl object-cover border-2 border-amber-300" />
                  )}
                  <div className="grid grid-cols-2 gap-2">
                    <input name="height" type="number" defaultValue={activeChild.heightInches || ''} placeholder="Height (Inches)" className="p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100" />
                    <input name="weight" type="number" defaultValue={activeChild.weightLbs || ''} placeholder="Weight (lbs)" className="p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100" />
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-0.5">Safety Limits & Boundaries:</label>
                    <textarea name="boundaries" defaultValue={activeChild.boundaries} rows="2" className="w-full p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100" />
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-0.5">Allergies & Dietary:</label>
                    <input name="allergies" defaultValue={activeChild.allergies} className="w-full p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100" />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-2.5 bg-bloom-coral text-white font-fredoka font-bold rounded-xl bubble-btn">Save</button>
                    <button type="button" onClick={() => setShowEditChildModal(false)} className="px-4 py-2.5 bg-slate-100 rounded-xl">Cancel</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD CHILD MODAL */}
          {showAddChildModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
              <div className="bg-white dark:bg-[#131826] rounded-3xl p-6 max-w-sm w-full shadow-2xl border-3 border-amber-200 text-xs font-semibold space-y-3">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bubble text-xl">Add Child ({children.length}/3 Free)</h3>
                  <button onClick={() => setShowAddChildModal(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const f = e.target;
                  const name = f.cName.value.trim();
                  const age = Number(f.cAge.value) || 4;
                  if (!name) return;

                  const newC = {
                    id: 'child_' + Date.now(),
                    name,
                    age,
                    tag: 'Second Born 🥈',
                    avatar: '👦🏽',
                    kidCode: generateKidCode(name),
                    currentlyWith: currentUser?.name || 'Caregiver',
                    custodySince: 'Just Now',
                    heightInches: null,
                    weightLbs: null,
                    isMeasurementsSkipped: true,
                    statedDream: 'Explorer & Builder 🚀',
                    boundaries: 'Stay within eyesight.',
                    allergies: 'None recorded.',
                    bedtime: '8:00 PM',
                    interests: [],
                    currentMood: 'Happy 😊',
                    contacts: [],
                    packingBag: [{ id: 'pb_1', item: 'Water bottle', packed: true }],
                    calendarEvents: [],
                    closet: [],
                    outfitRequests: [],
                    wishlist: []
                  };
                  setChildren([...children, newC]);
                  setActiveChildId(newC.id);
                  setShowAddChildModal(false);
                  triggerConfetti();
                  showToast(`Added ${name}!`);
                }} className="space-y-3">
                  <input name="cName" required placeholder="First Name (e.g. Leo)" className="w-full p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100" />
                  <input name="cAge" type="number" required defaultValue="4" placeholder="Age" className="w-full p-2 border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-[#181E2C] text-slate-800 dark:text-slate-100" />
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-2.5 bg-bloom-coral text-white font-fredoka font-bold rounded-xl bubble-btn">Save Child</button>
                    <button type="button" onClick={() => setShowAddChildModal(false)} className="px-4 py-2.5 bg-slate-100 rounded-xl">Cancel</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t-2 border-amber-200 dark:border-slate-700 bg-white/70 dark:bg-[#131826]/70 py-3.5 px-4 text-center text-xs text-slate-500 font-semibold">
            BloomBridge • Direct Updater/Viewer Portals & $0 Storage • Free Tier (1–3 Children) 🌸
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
